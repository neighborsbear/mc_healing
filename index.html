<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마크 힐링서버 사진관</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/js.js" defer></script>
</head>
<body>
    <!-- 우측 상단 BGM 컨트롤 영역 -->
    <div id="bgm-control-box">
        <button id="bgm-toggle" type="button">🔇 BGM OFF</button>
        <input type="range" id="bgm-volume" min="0" max="1" step="0.01" value="0.5" title="볼륨 조절">
    </div>

    <!-- 좌측 상단에 고정된 시즌 선택 메뉴 -->
    <div id="season-menu-box">
        <h2>시즌</h2>
        <ul id="sbtn">
            <li>-1</li>
            <li>0</li>
            <li>1</li>
        </ul>
    </div>

    <h1>마크 힐링서버 사진관</h1>

    <!-- 사진이 표시되는 공간 -->
    <div class="photos"></div>

    <!-- 하단 중앙에 고정되는 페이지네이션 버튼 영역 -->
    <div id="pagination-container">
        <div id="pagination"></div>
    </div>

    <audio id="bgm" loop></audio>
</body>
</html>
